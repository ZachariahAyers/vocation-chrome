name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  demo:
    name: Publish demo site
    needs: [check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:demo

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::993011736775:role/gh-deploy-opensource-vocation
          aws-region: us-east-1

      - name: Publish to ayers.repair/opensource/vocation/
        run: |
          aws s3 sync demo-dist/ s3://ayers-repair-site-993011736775/opensource/vocation/ \
            --delete --cache-control "public, max-age=300" --only-show-errors
          aws cloudfront create-invalidation --distribution-id E1CZIGG4O8R7UI \
            --paths "/opensource/vocation/*" --query Invalidation.Id --output text
